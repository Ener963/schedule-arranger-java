<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
  <div class="my-3">
    <div class="p-5 bg-light rounded-3">
      <h1 class="text-body">予定調整くん</h1>
      <p class="lead">
        予定調整くんは、GitHubで認証でき、予定を作って出欠が取れるサービスです。
      </p>
    </div>
  </div>
  <div class="my-3" th:if="${githubLogin != null}">
    <h3 class="my-3">予定を作る</h3>
    <a class="btn btn-primary" th:href="@{/schedules/new}">予定を作る</a>
    <div th:if="${!schedules.isEmpty()}">
      <h3 class="my-3">あなたの作った予定一覧</h3>
      <table class="table">
        <tr>
          <th>予定名</th>
          <th>更新日時</th>
        </tr>
        <tr th:each="schedule : ${schedules}">
          <td>
            <a th:href="@{/schedules/{id}(id=${schedule.scheduleId})}" th:text="${schedule.scheduleName}"></a>
          </td>
          <td th:text="${schedule.updatedAt}"></td>
        </tr>
      </table>
    </div>
  </div>
</div>
</body>
</html>
